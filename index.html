<!doctype html>
<html lang="en" data-theme="dark">
<!-- © 2026 Lai Long Charts. Bảo lưu mọi quyền. Không sao chép, chỉnh sửa hay dùng lại khi chưa được phép. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="copyright" content="© 2026 Lai Long Charts">
<meta name="description" content="COT, Seasonal and multi-chart terminal for commodities, FX, energy and crypto.">
<title>Lai Long Charts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='700' fill='%23ffa028' text-anchor='middle'%3ELL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">LL</span><span class="brand-name">LAI LONG CHARTS</span></div>
  <nav class="fkeys" id="nav">
    <a href="#cot" data-tab="cot"><kbd>1</kbd><span data-i18n="cot"></span></a>
    <a href="#seasonal" data-tab="seasonal"><kbd>2</kbd><span data-i18n="seasonal"></span></a>
    <a href="#charts" data-tab="charts"><kbd>3</kbd><span data-i18n="charts"></span></a>
  </nav>
  <div class="top-right">
    <span class="clock" id="clock"></span>
    <button class="tbtn" id="langBtn" title="Language / Ngôn ngữ"></button>
    <button class="tbtn" id="themeBtn"></button>
    <button class="tbtn" id="settingsBtn" title="Settings">⚙</button>
  </div>
</header>
<div class="tape" id="tape"><div class="tape-track" id="tapeTrack"></div></div>
<main id="view"></main>
<footer class="foot">
  <span id="status"></span>
  <span class="foot-src" data-i18n="source"></span>
  <span class="copy">© 2026 Lai Long Charts. Bảo lưu mọi quyền.</span>
</footer>

<div class="modal" id="settings" hidden>
  <div class="modal-box">
    <div class="modal-head"><span data-i18n="settings"></span><button class="tbtn" id="settingsClose">✕</button></div>
    <div class="modal-body">
      <div class="field"><span data-i18n="theme"></span>
        <div class="seg" id="themeSeg">
          <button data-v="dark" data-i18n="dark"></button><button data-v="light" data-i18n="light"></button>
        </div>
      </div>
      <label class="field"><span data-i18n="upcolor"></span><input type="color" data-color="up"></label>
      <label class="field"><span data-i18n="downcolor"></span><input type="color" data-color="down"></label>
      <label class="field"><span data-i18n="linecolor"></span><input type="color" data-color="line"></label>
      <label class="field"><span data-i18n="bgcolor"></span><input type="color" data-color="bg"></label>
      <div class="modal-foot"><button class="btn" id="colorsReset" data-i18n="reset"></button></div>
    </div>
  </div>
</div>

<script src="js/vendor/lightweight-charts.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>

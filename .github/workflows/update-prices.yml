name: Update Prices
on:
  schedule:
    - cron: "30 22 * * *"  # Daily 22:30 UTC, after US close
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: data-update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_prices.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898313+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: prices $(date -u +%F)" && git pull --rebase && git push)
      - name: Redeploy site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo ${{ github.repository }}
